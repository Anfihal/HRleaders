name: hrleaders
description: HRleaders reverse hiring client with FSP-verified profiles.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  shadcn_flutter: 0.0.55
  shadcn_flutter_material: 0.0.54
  material_ui: ^1.1.0
  go_router: ^17.0.0
  http: ^1.5.0
  intl: ^0.20.2
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  cupertino_icons: ^2.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/maps/russia.json
    - assets/images/handshake.png
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
