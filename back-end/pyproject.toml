[project]
name = "hrleaders-backend"
version = "0.1.0"
description = "HRleaders — IT hiring platform with FSP-verified candidate profiles (MVP backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.1,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "email-validator>=2.1,<3",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.8,<3",
    "httpx>=0.27,<1",
    "pillow>=11,<13",
    "nats-py>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "mock_fsp*"]

[tool.setuptools.package-data]
"mock_fsp" = ["data/*.json"]
"app.seed" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests touching the database or HTTP layer",
    "e2e: end-to-end business scenarios through the public API",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "mock_fsp", "migrations", "tests"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
